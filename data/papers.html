<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papers</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 1em;
        }

        .papers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 160px);
            gap: 0;
        }

        .paper-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .paper-item a {
            display: block;
            width: 160px;
            height: 210px;
            border: 1px solid #ccc;
            overflow: hidden;
            text-decoration: none;
        }

        .paper-item canvas {
            width: 160px;
            height: 210px;
        }

        .paper-item a:hover {
            border-color: purple;
        }

        .paper-title {
            font-size: 0.8em;
            text-align: center;
            margin-top: 0.4em;
            color: #333;
            width: 160px;
        }
    </style>
</head>
<body>
    <div class="papers-grid" id="papers-grid"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const papers = [
            { path: '/documents/semantic_data_management.pdf', title: 'Semantic Data Management' },
            { path: '/documents/performance_anti_patterns.pdf', title: 'Performance Anti-Patterns' },
            { path: '/documents/miy.pdf', title: 'Make It Yourself' },
            { path: '/documents/Granovetter_Weak_Ties.pdf', title: 'The Strength of Weak Ties' },
            { path: '/documents/engineering_of_programming_languages.pdf', title: 'Engineering of Programming Languages' },
            { path: '/documents/fail_fast.pdf', title: 'Fail Fast' },
            { path: '/documents/Lockeretal2010_MicrosoftWord-LockREV2.pdf', title: 'The Breakup of Romantic Relationships: Situational Predictors of Perception of Recovery' },
            { path: '/documents/Sprecher_Felmlee_etal.FactorsDistressBreakupJSPR-1998.pdf', title: 'Factors Associated with Distress Following the Breakup of a Close Relationship' },
        ];

        const grid = document.getElementById('papers-grid');

        papers.forEach(paper => {
            const item = document.createElement('div');
            item.className = 'paper-item';

            const link = document.createElement('a');
            link.href = paper.path;
            link.target = '_blank';

            const canvas = document.createElement('canvas');
            link.appendChild(canvas);
            item.appendChild(link);

            const title = document.createElement('div');
            title.className = 'paper-title';
            title.textContent = paper.title;
            item.appendChild(title);

            grid.appendChild(item);

            pdfjsLib.getDocument(paper.path).promise.then(pdf => {
                return pdf.getPage(1);
            }).then(page => {
                const viewport = page.getViewport({ scale: 1 });
                const scale = (160 / viewport.width) * 3;
                const scaled = page.getViewport({ scale });
                canvas.width = scaled.width;
                canvas.height = scaled.height;
                canvas.style.width = '160px';
                canvas.style.height = '210px';
                page.render({ canvasContext: canvas.getContext('2d'), viewport: scaled });
            });
        });
    </script>
</body>
</html>
