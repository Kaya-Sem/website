        .intro-box::before {

            border: 2px solid #000000;

            content: '';

            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border: 2px solid #000000;
            border-radius: 11px;
            animation: glitchBorder 20s ease-in-out infinite;
            z-index: -2;
        }

        @keyframes glitchBorder {
            0%, 100% {
                transform: translate(0, 0) skew(0deg);
            }
            10% {
                transform: translate(-2px, 1px) skew(-1deg);
            }
            20% {
                transform: translate(1px, -2px) skew(1deg);
            }
            30% {
                transform: translate(-1px, 2px) skew(-0.5deg);
            }
            40% {
                transform: translate(2px, -1px) skew(0.5deg);
            }
            50% {
                transform: translate(-1px, -1px) skew(-0.3deg);
            }
            60% {
                transform: translate(1px, 1px) skew(0.3deg);
